<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k-pond</title>
  <meta name="description" content="An ASCII pond where frogs hop between lily pads.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#05141a">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <script>
    // set the theme before first paint so there's no flash of the wrong pond
    (function () {
      var t = null;
      try { t = localStorage.getItem('k-pond-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root {
      --bg: #05141a;
      --ink: #9fc9b8;
      --ink-hover: #d8f3e6;
      --muted: #4f7f78;
      --line: #1d4048;
      --line-hover: #3d7f84;
      --panel: rgba(5, 20, 26, 0.78);
      --focus: #7fd0dc;
      --on: #f5d74a;
      --on-line: #6b6230;
      color-scheme: dark;
      --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #eef3ec;
        --ink: #2c5a50;
        --ink-hover: #0f3a31;
        --muted: #6b8c84;
        --line: #c4d6cc;
        --line-hover: #7fa89c;
        --panel: rgba(238, 243, 236, 0.85);
        --focus: #1f7f8c;
        --on: #9a6f00;
        --on-line: #d8c27a;
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #eef3ec;
      --ink: #2c5a50;
      --ink-hover: #0f3a31;
      --muted: #6b8c84;
      --line: #c4d6cc;
      --line-hover: #7fa89c;
      --panel: rgba(238, 243, 236, 0.85);
      --focus: #1f7f8c;
      --on: #9a6f00;
      --on-line: #d8c27a;
      color-scheme: light;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font: 12px/1.4 var(--mono);
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .hud {
      position: fixed;
      z-index: 1;
      pointer-events: none;
    }
    .title {
      top: 14px;
      left: 16px;
      letter-spacing: 0.08em;
      text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg);
    }
    .title span { color: var(--muted); }
    .controls {
      top: 10px;
      right: 12px;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }
    button {
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--line-hover); color: var(--ink-hover); }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button[aria-pressed="true"] { color: var(--on); border-color: var(--on-line); }
    .hint {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      box-sizing: border-box;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--muted);
      background: var(--panel);
      text-align: center;
      transition: opacity 1.2s ease;
    }
    .hint.dim { opacity: 0.35; }
    kbd {
      font: inherit;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <canvas id="pond" role="img" aria-label="An ASCII pond where frogs hop between lily pads"></canvas>

  <div class="hud title">k-pond <span>~ frogs ~</span></div>

  <div class="hud controls">
    <button id="theme" type="button">night</button>
    <button id="leap" type="button" title="Every frog leaps at once (space)">leap</button>
    <button id="sound" type="button" aria-pressed="false">sound off</button>
  </div>

  <div class="hud hint" id="hint">
    click a frog to make it hop · click a pad to call one over · click the water to spook them · <kbd>space</kbd> everyone leaps
  </div>

  <script src="pond.js"></script>
</body>
</html>
