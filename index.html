<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>k-pond</title>
  <meta name="description" content="An ASCII pond where frogs hop between lily pads.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#121a1b">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <script>
    // set the theme before first paint so there's no flash of the wrong pond
    (function () {
      var t = null;
      try { t = localStorage.getItem('k-pond-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root {
      --bg: #121a1b;
      --ink: #cfe3dc;
      --muted: rgba(207, 227, 220, 0.38);
      --chip: rgba(18, 26, 27, 0.55);
      --chip-hover: rgba(207, 227, 220, 0.1);
      --focus: #7fd0dc;
      color-scheme: dark;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f3f1ea;
        --ink: #2c4a45;
        --muted: rgba(44, 74, 69, 0.4);
        --chip: rgba(243, 241, 234, 0.6);
        --chip-hover: rgba(44, 74, 69, 0.08);
        --focus: #1f7f8c;
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #f3f1ea;
      --ink: #2c4a45;
      --muted: rgba(44, 74, 69, 0.4);
      --chip: rgba(243, 241, 234, 0.6);
      --chip-hover: rgba(44, 74, 69, 0.08);
      --focus: #1f7f8c;
      color-scheme: light;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* the only chrome: a quiet cluster in the corner */
    .controls {
      position: fixed;
      z-index: 1;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: var(--chip);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      opacity: 0.55;
      transition: opacity 0.4s ease;
    }
    .controls:hover, .controls:focus-within { opacity: 1; }
    @media (hover: none) { .controls { opacity: 0.8; } }

    .controls button {
      display: grid;
      place-items: center;
      height: 30px;
      min-width: 30px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .controls button:hover { background: var(--chip-hover); }
    .controls button:focus-visible { outline: 1.5px solid var(--focus); outline-offset: 1px; }

    /* style switch: two tiny labels, the active one lit */
    .styles { display: flex; padding-left: 4px; }
    .styles button {
      min-width: 26px;
      font: 500 10px/1 var(--mono);
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .styles button[aria-pressed="true"] { color: var(--ink); }
    .divider {
      width: 1px;
      height: 14px;
      margin: 0 3px;
      background: var(--muted);
      opacity: 0.6;
    }

    /* icon buttons hold both icons; the current state's icon is shown */
    .icon {
      position: relative;
      width: 30px;
    }
    .icon svg {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: rotate(-45deg) scale(0.6);
      transition: opacity 0.3s ease, transform 0.4s ease;
    }
    :root[data-theme="light"] #theme .sun,
    :root:not([data-theme="light"]) #theme .moon,
    #sound[aria-pressed="true"] .speaker-on,
    #sound:not([aria-pressed="true"]) .speaker-off {
      opacity: 1;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .controls, .controls button, .icon svg { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="pond" role="img" aria-label="An ASCII pond where frogs hop between lily pads"></canvas>

  <div class="controls">
    <div class="styles" role="group" aria-label="Drawing style">
      <button type="button" data-style="v1" aria-pressed="false" aria-label="Style v1: fine ASCII">v1</button>
      <button type="button" data-style="v2" aria-pressed="true" aria-label="Style v2: tiles and glyphs">v2</button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <button id="theme" class="icon" type="button" aria-label="Switch to day">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>
      </svg>
    </button>
    <button id="sound" class="icon" type="button" aria-pressed="false" aria-label="Sound">
      <svg class="speaker-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path d="m16 9.5 5 5M21 9.5l-5 5"/>
      </svg>
      <svg class="speaker-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>
      </svg>
    </button>
  </div>

  <script src="common.js"></script>
  <script src="render-v1.js"></script>
  <script src="render-v2.js"></script>
  <script src="pond.js"></script>
</body>
</html>
