<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kyle Aquino</title>
  <meta name="description" content="Kyle Aquino, software engineer and platform lead at Parallel Distribution.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#05141a">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script>
    // set the theme before first paint so there's no flash of the wrong pond
    (function () {
      var t = null;
      try { t = localStorage.getItem('k-pond-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root {
      --bg: #05141a;
      --ink: #cfe3dc;
      --muted: rgba(207, 227, 220, 0.38);
      --soft: rgba(207, 227, 220, 0.62);
      --chip: rgba(18, 26, 27, 0.55);
      --chip-hover: rgba(207, 227, 220, 0.1);
      --focus: #7fd0dc;
      color-scheme: dark;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #eef3ec;
        --ink: #2c4a45;
        --muted: rgba(44, 74, 69, 0.4);
        --soft: rgba(44, 74, 69, 0.66);
        --chip: rgba(243, 241, 234, 0.6);
        --chip-hover: rgba(44, 74, 69, 0.08);
        --focus: #1f7f8c;
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #eef3ec;
      --ink: #2c4a45;
      --muted: rgba(44, 74, 69, 0.4);
      --soft: rgba(44, 74, 69, 0.66);
      --chip: rgba(243, 241, 234, 0.6);
      --chip-hover: rgba(44, 74, 69, 0.08);
      --focus: #1f7f8c;
      color-scheme: light;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Text floats on the pond. The pond fades out around anything marked
       data-pond-avoid, and lily pads drift away from it. Clicks pass
       through to the water. */
    .intro, .haiku {
      position: fixed;
      z-index: 1;
      margin: 0;
      pointer-events: none;
      color: var(--ink);
      animation: surface 1.6s ease both;
    }
    .intro {
      left: max(clamp(22px, 6vw, 80px), env(safe-area-inset-left));
      top: max(clamp(26px, 10vh, 104px), env(safe-area-inset-top));
      max-width: min(30rem, calc(100vw - 150px));
      font-family: var(--mono);
    }
    .intro h1 {
      margin: 0;
      font-size: clamp(17px, 1.9vw, 21px);
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .intro p {
      margin: 0.7em 0 0;
      font-size: 13px;
      line-height: 1.65;
      color: var(--soft);
    }
    .haiku {
      right: max(clamp(22px, 5vw, 72px), env(safe-area-inset-right));
      top: max(clamp(26px, 10vh, 104px), env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      animation-delay: 0.5s;
    }
    .haiku blockquote {
      margin: 0;
      writing-mode: vertical-rl;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", serif;
      font-size: 15px;
      line-height: 2.1;
      letter-spacing: 0.3em;
    }
    .haiku figcaption {
      font: 400 11px/1.7 var(--mono);
      color: var(--soft);
      text-align: right;
      white-space: nowrap;
    }
    .haiku cite {
      display: block;
      margin-top: 0.6em;
      font-style: normal;
      color: var(--muted);
    }
    @media (max-width: 560px) {
      /* phones: the haiku moves down to the bottom left, clear of the name */
      .intro { max-width: calc(100vw - 44px); }
      .haiku {
        top: auto;
        right: auto;
        left: max(22px, env(safe-area-inset-left));
        bottom: max(76px, calc(env(safe-area-inset-bottom) + 62px));
        align-items: flex-start;
      }
      .haiku figcaption { text-align: left; }
    }
    @keyframes surface {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    /* the only chrome: a quiet cluster in the corner */
    .controls {
      position: fixed;
      z-index: 1;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: var(--chip);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      opacity: 0.55;
      transition: opacity 0.4s ease;
    }
    .controls:hover, .controls:focus-within { opacity: 1; }
    @media (hover: none) { .controls { opacity: 0.8; } }

    .controls button, .controls a {
      display: grid;
      place-items: center;
      height: 30px;
      min-width: 30px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .controls button:hover, .controls a:hover { background: var(--chip-hover); }
    .controls button:focus-visible, .controls a:focus-visible { outline: 1.5px solid var(--focus); outline-offset: 1px; }
    .controls a { box-sizing: border-box; }
    /* a plain link icon: always visible, unlike the two-state toggles */
    .controls .link svg { opacity: 1; transform: none; }

    /* style switch: two tiny labels, the active one lit */
    .styles { display: flex; padding-left: 4px; }
    .styles button {
      min-width: 26px;
      font: 500 10px/1 var(--mono);
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .styles button[aria-pressed="true"] { color: var(--ink); }
    .divider {
      width: 1px;
      height: 14px;
      margin: 0 3px;
      background: var(--muted);
      opacity: 0.6;
    }

    /* icon buttons hold both icons; the current state's icon is shown */
    .icon {
      position: relative;
      width: 30px;
    }
    .icon svg {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: rotate(-45deg) scale(0.6);
      transition: opacity 0.3s ease, transform 0.4s ease;
    }
    :root[data-theme="light"] #theme .sun,
    :root:not([data-theme="light"]) #theme .moon,
    #sound[aria-pressed="true"] .speaker-on,
    #sound:not([aria-pressed="true"]) .speaker-off {
      opacity: 1;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .controls, .controls button, .controls a, .icon svg { transition: none; }
      .intro, .haiku { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="pond" aria-hidden="true"></canvas>

  <header class="intro" data-pond-avoid>
    <h1>Kyle Aquino</h1>
    <p>Software Engineer &amp; Platform Lead<br>at Parallel Distribution</p>
  </header>

  <figure class="haiku" data-pond-avoid>
    <blockquote lang="ja">古池や<br>蛙飛び込む<br>水の音</blockquote>
    <figcaption>an old pond<br>a frog leaps in<br>the sound of water<cite>Matsuo Bashō</cite></figcaption>
  </figure>

  <div class="controls">
    <div class="styles" role="group" aria-label="Drawing style">
      <button type="button" data-style="v1" aria-pressed="true" aria-label="Style v1: fine ASCII">v1</button>
      <button type="button" data-style="v2" aria-pressed="false" aria-label="Style v2: tiles and glyphs">v2</button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <button id="theme" class="icon" type="button" aria-label="Switch to day">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>
      </svg>
    </button>
    <button id="sound" class="icon" type="button" aria-pressed="false" aria-label="Sound">
      <svg class="speaker-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path d="m16 9.5 5 5M21 9.5l-5 5"/>
      </svg>
      <svg class="speaker-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>
      </svg>
    </button>
    <a class="icon link" href="https://www.linkedin.com/in/kpaquino/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)" title="LinkedIn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/>
        <path d="M8.5 10.5v5.5M12 16v-5.5M12 13a2.5 2.5 0 0 1 5 0v3"/>
        <path d="M8.5 7.6v.1" stroke-width="2"/>
      </svg>
    </a>
  </div>

  <script src="common.js"></script>
  <script src="render-v1.js"></script>
  <script src="render-v2.js"></script>
  <script src="pond.js"></script>
</body>
</html>
